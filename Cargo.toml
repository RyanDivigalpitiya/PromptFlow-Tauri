# Workspace for the SYNC halves of the project only. `src-tauri` is deliberately
# EXCLUDED and carries its own empty `[workspace]` table: the tauri CLI,
# `scripts/build.sh` and `scripts/verify.sh` all hardcode `src-tauri/target/...`,
# and folding it in here would move that directory to the workspace root.
[workspace]
resolver = "2"
members = ["crates/promptflow-core", "crates/pf-sync-server"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
