[package]
name = "pf-sync-server"
version.workspace = true
edition.workspace = true
description = "PromptFlow sync hub — canonical replica + oplog behind a Cloudflare tunnel"

[[bin]]
name = "promptflow-sync"
path = "src/main.rs"

[dependencies]
promptflow-core = { path = "../promptflow-core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
jsonwebtoken = "11"
ureq = { version = "3", features = ["rustls"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
