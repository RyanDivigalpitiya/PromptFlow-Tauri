# /etc/newsyslog.d/promptflow-sync.conf — install with ONE sudo on the mini:
#
#   sudo install -m 644 -o root -g wheel \
#     ~/PromptFlow-Sync/promptflow-sync.newsyslog.conf \
#     /etc/newsyslog.d/promptflow-sync.conf
#
# launchd never rotates a StandardOutPath file itself, so without this the log grows
# without bound on shared hardware. Rotate at 10 MB, keep 5, bzip2 the old ones.
# __USER__ is substituted by scripts/sync-deploy.sh from the mini's own $USER.
#
# logfilename                                 [owner:group]  mode count size when  flags
/opt/homebrew/var/log/promptflow-sync.log         __USER__:staff  644  5     10240 *     J
/opt/homebrew/var/log/promptflow-sync-backup.log  __USER__:staff  644  5     10240 *     J
